<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Comanda de ingreso</title>
<style>
  :root{
    --papel:#fbf7ef;--carta:#ffffff;--tinta:#231c12;--tinta-suave:#7a6f5c;
    --hair:#e3d9c6;--hair-fuerte:#cfc4ac;--rojo:#b3402a;--crema:#efe8d9;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--tinta);-webkit-font-smoothing:antialiased;overflow:hidden;
    background:
      repeating-linear-gradient(135deg, rgba(227,217,198,.35) 0 1px, transparent 1px 12px),
      var(--papel);
  }
  .stage{position:relative;height:100vh;display:flex;flex-direction:column}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  /* ---- Escena: la barra de noche en tonos papel ---- */
  .scene{position:relative;flex:1;display:flex;flex-direction:column;align-items:center}
  .wordmark{margin-top:118px;font-size:42px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1}
  .tagline{margin-top:10px;font-size:13px;color:var(--tinta-suave)}
  .lamp{position:absolute;top:0;display:flex;flex-direction:column;align-items:center}
  .lamp i{display:block}
  .cord{width:2px;background:var(--tinta-suave);opacity:.7}
  .shade{width:52px;height:24px;border-radius:52px 52px 0 0;background:var(--tinta);position:relative;z-index:2}
  .glow{width:120px;height:84px;margin-top:-6px;background:radial-gradient(ellipse at 50% 0%, rgba(207,196,172,.55), transparent 68%);z-index:1}
  .lamp-a{left:10%}.lamp-a .cord{height:42px}
  .lamp-b{right:8%}.lamp-b .cord{height:80px}.lamp-b .shade{background:var(--rojo);opacity:.92}
  .shelf{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:flex-end;justify-content:center;gap:20px}
  .b{width:26px;border:1.5px solid var(--hair-fuerte);border-bottom:0;border-radius:10px 10px 0 0;position:relative;background:var(--crema)}
  .b::before{content:"";position:absolute;top:-13px;left:50%;transform:translateX(-50%);width:8px;height:13px;background:inherit;border:1.5px solid var(--hair-fuerte);border-bottom:0;border-radius:3px 3px 0 0}
  .b1{height:74px}
  .b2{height:100px;background:var(--carta)}
  .b3{height:54px}
  .b4{height:88px;background:var(--rojo);border-color:var(--rojo);opacity:.88}
  .b4::before{border-color:var(--rojo)}
  .b5{height:64px;background:var(--carta)}
  .b6{height:82px}

  /* ---- Drawer ticket ---- */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--carta);box-shadow:0 -8px 30px rgba(60,45,20,.14);padding:0 28px 26px;animation:sheet-in 220ms cubic-bezier(.2,0,0,1) .14s backwards}
  @keyframes sheet-in{from{transform:translateY(100%)}}
  .sc{height:10px;margin:0 -28px;background:radial-gradient(circle at 8px 0,transparent 6px,var(--carta) 6.5px);background-size:16px 10px;background-repeat:repeat-x}
  .handle{width:36px;height:4px;border-radius:999px;background:var(--hair-fuerte);margin:8px auto 14px}
  .tk-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:2px}
  .tk-title{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .tk-num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--tinta-suave)}
  .tk-sub{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-suave);margin-top:4px}
  .tk-cut{position:relative;border-top:2px dashed var(--hair-fuerte);margin:16px 0 18px}
  .tk-cut span{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--carta);padding:0 10px;font-size:12px;color:var(--hair-fuerte)}

  form{display:grid;gap:14px}
  .micro{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-suave);margin-bottom:6px}
  input{height:48px;width:100%;border-radius:8px;border:1px solid var(--hair-fuerte);background:var(--papel);padding:0 14px;font-size:15px;color:var(--tinta);font-family:inherit}
  input::placeholder{color:var(--tinta-suave);opacity:.7}
  .error{border:1px solid rgba(179,64,42,.4);background:rgba(179,64,42,.05);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--rojo)}
  .primary{height:48px;border:0;border-radius:8px;background:var(--tinta);color:var(--papel);font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-family:inherit;cursor:pointer;margin-top:4px;transition:opacity 150ms ease}
  .primary:hover{opacity:.9}
  .primary:disabled{opacity:.5;cursor:default}
  .barcode{margin-top:20px;height:32px;background:repeating-linear-gradient(90deg,var(--tinta) 0 2px,transparent 2px 5px,var(--tinta) 5px 6px,transparent 6px 10px);opacity:.85}
  .barcode-cap{text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10px;letter-spacing:.2em;color:var(--tinta-suave);margin-top:6px}

  .demo{position:fixed;top:12px;right:12px;z-index:20;display:flex;gap:8px}
  .demo button{font-family:inherit;font-size:11px;font-weight:600;padding:8px 12px;border-radius:999px;border:1px solid var(--hair-fuerte);background:var(--carta);color:var(--tinta);cursor:pointer}
  .demo button[aria-pressed="true"]{background:var(--tinta);color:var(--papel)}
  :focus-visible{outline:2px solid var(--rojo);outline-offset:2px}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:1ms !important;transition-duration:1ms !important}
  }
</style>
</head>
<body>
<main class="stage">
  <section class="scene" aria-hidden="true">
    <div class="lamp lamp-a"><i class="cord"></i><i class="shade"></i><i class="glow"></i></div>
    <div class="lamp lamp-b"><i class="cord"></i><i class="shade"></i><i class="glow"></i></div>
    <h1 class="wordmark">La Barra</h1>
    <p class="tagline">Ventas y cortesías de tu turno</p>
    <div class="shelf">
      <div class="b b1"></div><div class="b b2"></div><div class="b b3"></div>
      <div class="b b4"></div><div class="b b5"></div><div class="b b6"></div>
    </div>
  </section>

  <section class="sheet" role="dialog" aria-labelledby="login-h" id="sheet2">
    <div class="sc" aria-hidden="true"></div>
    <div class="handle" aria-hidden="true"></div>
    <header class="tk-head">
      <h2 id="login-h" class="tk-title">Comanda de ingreso</h2>
      <span class="tk-num">Nº 0142</span>
    </header>
    <p class="tk-sub">turno · personal de barra</p>
    <div class="tk-cut" aria-hidden="true"><span>✂</span></div>
    <form>
      <div>
        <label class="micro" for="email2">Email</label>
        <input id="email2" type="email" autocomplete="email" placeholder="vos@mibar.ar" required>
      </div>
      <div>
        <label class="micro" for="pass2">Contraseña</label>
        <input id="pass2" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <p id="form-error2" class="error" hidden>No pudimos iniciar sesión. Revisá el email y la contraseña.</p>
      <button id="submit2" class="primary" type="submit">Iniciar sesión</button>
    </form>
    <div class="barcode" aria-hidden="true"></div>
    <p class="barcode-cap" aria-hidden="true">BAR·TURNO·0142</p>
  </section>

  <div class="demo" aria-label="Controles de demostración">
    <button type="button" id="replay2">↻ Reproducir</button>
    <button type="button" id="err2" aria-pressed="false">Error</button>
    <button type="button" id="load2" aria-pressed="false">Cargando</button>
  </div>
</main>
<script>
  var sheet=document.getElementById('sheet2');
  document.getElementById('replay2').addEventListener('click',function(){
    sheet.style.animation='none';void sheet.offsetHeight;sheet.style.animation='';
  });
  var err=document.getElementById('form-error2'),errBtn=document.getElementById('err2');
  errBtn.addEventListener('click',function(){
    var on=err.hasAttribute('hidden');
    if(on){err.removeAttribute('hidden')}else{err.setAttribute('hidden','')}
    errBtn.setAttribute('aria-pressed',String(on));
  });
  var btn=document.getElementById('submit2'),loadBtn=document.getElementById('load2');
  loadBtn.addEventListener('click',function(){
    var on=btn.disabled;
    btn.disabled=!on;
    btn.textContent=!on?'Ingresando…':'Iniciar sesión';
    loadBtn.setAttribute('aria-pressed',String(!on));
  });
  document.querySelector('form').addEventListener('submit',function(e){e.preventDefault()});
</script>
</body>
</html>
